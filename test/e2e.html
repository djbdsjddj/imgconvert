<!doctype html>
<meta charset="utf-8">
<title>e2e</title>
<body>
<script type="module">
// Drives the real generated pages: puts a file into #file, submits the form, measures the download.
const runPage = (url, file) => new Promise((ok, fail) => {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:900px;height:900px';
  f.src = url;
  document.body.append(f);
  f.onload = () => {
    const d = f.contentDocument;
    const dt = new DataTransfer();
    dt.items.add(file);
    d.getElementById('file').files = dt.files;
    d.getElementById('tool').requestSubmit();
    const t0 = performance.now();
    const iv = setInterval(async () => {
      if (!d.getElementById('result').hidden) {
        clearInterval(iv);
        const out = await (await fetch(d.getElementById('download').href)).blob();
        const t = d.getElementById('target');
        const target = t ? Math.floor(t.value * (d.getElementById('unit').value === 'MB' ? 1048576 : 1024)) : null;
        ok({ page: decodeURIComponent(url), input: file.name, inputBytes: file.size, target, outputBytes: out.size,
          outputType: out.type, dims: d.getElementById('dims').textContent, status: d.getElementById('status').textContent,
          seconds: ((performance.now() - t0) / 1000).toFixed(1) });
      } else if (performance.now() - t0 > 150000) { clearInterval(iv); fail(new Error('timeout on ' + url)); }
    }, 200);
  };
});

const post = (body) => fetch('/result', { method: 'POST', body: JSON.stringify(body) });
try {
  const photoBlob = await (await fetch('/fixture.jpg')).blob();
  const photo = new File([photoBlob], 'photo.jpg', { type: 'image/jpeg' });

  // A "scanned document" PDF: 4 pages, each a full-quality photo (~ what a phone scan app produces).
  await new Promise((ok) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; s.onload = ok; document.head.append(s); });
  const doc = await PDFLib.PDFDocument.create();
  const bytes = await photoBlob.arrayBuffer();
  for (let i = 0; i < 4; i++) {
    const img = await doc.embedJpg(bytes);
    doc.addPage([595, 842]).drawImage(img, { x: 0, y: 0, width: 595, height: 842 });
  }
  const pdf = new File([await doc.save()], 'scan.pdf', { type: 'application/pdf' });

  // A PNG for the converter.
  const bmp = await createImageBitmap(photoBlob);
  const c = new OffscreenCanvas(bmp.width, bmp.height);
  c.getContext('2d').drawImage(bmp, 0, 0);
  const png = new File([await c.convertToBlob({ type: 'image/png' })], 'photo.png', { type: 'image/png' });

  const results = [];
  results.push(await runPage('/compress-image-to-100kb', photo));
  results.push(await runPage('/compress-image-to-20kb', photo));
  results.push(await runPage('/' + encodeURIComponent('сжать-фото-до-50кб'), photo));
  results.push(await runPage('/compress-pdf-to-1mb', pdf));
  results.push(await runPage('/' + encodeURIComponent('сжать-пдф-до-500кб'), pdf));
  results.push(await runPage('/compress-pdf-to-200kb', pdf));
  results.push(await runPage('/heic-to-jpg', png));
  await post({ results });
} catch (e) {
  await post({ error: String(e.stack || e) });
}
</script>
</body>
